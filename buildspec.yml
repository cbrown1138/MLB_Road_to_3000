version: 0.2

# Expects these as environment variables on the CodeBuild project itself
# (Part B setup), not hardcoded here: DATA_BUCKET, SITE_BUCKET, DISTRIBUTION_ID
#
# The data bucket mirrors site/data/: players/<id>.json, players/index.json and
# league/hits_by_season.json, written daily by the stats-refresh Lambda
# (data_processing/jobs/daily.py). The sync has no --delete, so committed files
# that never live in S3 (retired players, qualified_hitters.json) are kept.

phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - aws s3 sync "s3://${DATA_BUCKET}/" site/data/ --exclude "*" --include "players/*" --include "league/*"
      - test -s site/data/players/index.json && test -s site/data/league/hits_by_season.json
  build:
    on-failure: ABORT
    commands:
      - cd site
      - npm ci
      - npm run build
  post_build:
    commands:
      - aws s3 sync ./out "s3://${SITE_BUCKET}" --delete
      - aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths "/*"
