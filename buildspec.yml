version: 0.2

# Expects these as environment variables on the CodeBuild project itself
# (Part B setup), not hardcoded here: DATA_BUCKET, SITE_BUCKET, DISTRIBUTION_ID
#
# The data bucket is flat: stats_<Last><First>.json (one per active player) and
# stats_league.json, written daily by the stats-refresh Lambda. Only those are
# synced, so committed data that never lives in S3 (site/data/club/) is untouched.

phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - aws s3 sync "s3://${DATA_BUCKET}/" site/data/active/ --delete --exclude "*" --include "stats_*.json" --exclude "stats_league.json" --exclude "history/*"
      - aws s3 cp "s3://${DATA_BUCKET}/stats_league.json" site/data/stats_league.json
      - ls site/data/active/stats_*.json > /dev/null
  build:
    on-failure: ABORT
    commands:
      - cd site
      - npm ci
      - npm run build
  post_build:
    commands:
      - aws s3 sync ./out "s3://${SITE_BUCKET}" --delete
      - aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths "/*"
